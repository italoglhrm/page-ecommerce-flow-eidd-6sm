<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="line-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6d5cff"/>
      <stop offset="50%"  stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#ff5ca1"/>
    </linearGradient>
    <linearGradient id="bg-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a1730"/>
      <stop offset="100%" stop-color="#111322"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg-g)"/>

  <!-- Sequence curve -->
  <path d="M5 23 C9 23 9 9 16 16 C23 23 23 9 27 9"
        fill="none" stroke="url(#line-g)" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Node 1 — purple -->
  <circle cx="5"  cy="23" r="3" fill="#6d5cff"/>

  <!-- Node 2 — cyan -->
  <circle cx="16" cy="16" r="3" fill="#00d4aa"/>

  <!-- Node 3 — pink, with halo to suggest "discovery" -->
  <circle cx="27" cy="9"  r="4.5" fill="#ff5ca1" opacity="0.15"/>
  <circle cx="27" cy="9"  r="3"   fill="#ff5ca1"/>
</svg>
